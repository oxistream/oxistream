{{- if include "oxistream.multiReplica" . }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oxistream.fullname" . }}
  labels:
    {{- include "oxistream.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oxistream.selectorLabels" . | nindent 6 }}
{{- end }}
