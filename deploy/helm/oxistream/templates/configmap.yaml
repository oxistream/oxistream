apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oxistream.fullname" . }}
  labels:
    {{- include "oxistream.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if not (hasPrefix "OXISTREAM_" $key) }}
  {{- fail (printf "config.%s: only OXISTREAM_* variables belong here, use extraEnv for others" $key) }}
  {{- end }}
  {{- if has $key (list "OXISTREAM_DATABASE_URL" "OXISTREAM_PROXY_SECRET" "OXISTREAM_OIDC_CLIENT_SECRET") }}
  {{- fail (printf "config.%s is a secret, use the dedicated values" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
