{{- $db := .Values.database }}
{{- $dbUrl := and (not $db.cnpgCluster) (not $db.existingSecret) $db.url }}
{{- $proxy := not .Values.proxySecret.existingSecret }}
{{- $oidc := and (not .Values.oidcClientSecret.existingSecret) .Values.oidcClientSecret.value }}
{{- if or $dbUrl $proxy $oidc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oxistream.fullname" . }}
  labels:
    {{- include "oxistream.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $dbUrl }}
  database-url: {{ $db.url | b64enc | quote }}
  {{- end }}
  {{- if $proxy }}
  proxy-secret: {{ include "oxistream.proxySecretValue" . | b64enc | quote }}
  {{- end }}
  {{- if $oidc }}
  oidc-client-secret: {{ .Values.oidcClientSecret.value | b64enc | quote }}
  {{- end }}
{{- end }}
