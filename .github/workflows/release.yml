name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to release (vX.Y.Z); with dry run also a branch or commit
        required: true
      dry-run:
        description: Build without pushing
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REF: ${{ inputs.ref || github.ref_name }}
  PUSH: ${{ github.event_name == 'push' || !inputs.dry-run }}
  CHART: deploy/helm/oxistream

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - name: Check versions
        id: version
        run: |
          cargo=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          lock=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("backend/Cargo.lock", "rb"))["package"] if p["name"] == "oxistream-server"))')
          app=$(yq '.appVersion' "$CHART/Chart.yaml")
          chart=$(yq '.version' "$CHART/Chart.yaml")
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]] && git ls-remote --exit-code --tags origin "refs/tags/$REF" > /dev/null; then
            version=${BASH_REMATCH[1]}
          elif [[ "$PUSH" == "true" ]]; then
            echo "::error::$REF is not a semver tag vX.Y.Z" >&2
            exit 1
          else
            version=$cargo
          fi
          status=0
          for pair in "Cargo.toml:$cargo" "Cargo.lock:$lock" "Chart.yaml appVersion:$app" "Chart.yaml version:$chart"; do
            if [[ "${pair##*:}" != "$version" ]]; then
              echo "::error::${pair%:*} is ${pair##*:}, expected $version" >&2
              status=1
            fi
          done
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "sha=$(git rev-parse HEAD)"
            echo "short-sha=$(git rev-parse --short=7 HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: docker/metadata-action@v6
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }},enable=${{ !startsWith(steps.version.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=sha-${{ steps.version.outputs.short-sha }}
          # Keep the Dockerfile's labels where metadata-action would use repository metadata.
          labels: |
            org.opencontainers.image.title=Oxistream
            org.opencontainers.image.description=Self-hosted, privacy-friendly YouTube frontend
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
          annotations: |
            org.opencontainers.image.title=Oxistream
            org.opencontainers.image.description=Self-hosted, privacy-friendly YouTube frontend
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            OXISTREAM_GIT_SHA=${{ steps.version.outputs.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          # Reads CI's amd64 cache; writes its own so CI's scope is not overwritten.
          cache-from: |
            type=gha
            type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - uses: actions/attest-build-provenance@v4
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - name: Package chart
        run: helm package "$CHART" --destination "$RUNNER_TEMP/chart"
      - name: Push chart
        if: env.PUSH == 'true'
        env:
          VERSION: ${{ needs.image.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/oxistream-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
