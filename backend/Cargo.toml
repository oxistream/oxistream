[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/oxistream/oxistream"
publish = false

[workspace.dependencies]
oxistream-dash = { path = "crates/oxistream-dash" }
oxistream-db = { path = "crates/oxistream-db" }

anyhow = "1.0.105"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
governor = { version = "0.10.4", default-features = false }
hmac = "0.13.0"
http-body-util = "0.1.5"
insta = "1.49.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
moka = { version = "0.12.16", features = ["future"] }
openidconnect = { version = "4.1.0", default-features = false }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "stream",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rsa = "0.10.0"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
rustypipe = { package = "oxipipe", git = "https://github.com/oxistream/oxipipe", rev = "92ba30d9a40bdbde58812063c53768b6f7417116", default-features = false, features = [
  "rustls-tls-webpki-roots",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "migrate",
  "macros",
  "json",
  "time",
  "uuid",
] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["time", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.3", features = ["serde"] }
webpki-roots = "1.0.12"

# Password hashing is unusably slow without optimizations.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Test RSA keys are generated at runtime.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
