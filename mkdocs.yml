site_name: Oxistream
site_description: Self-hosted, privacy-friendly YouTube frontend
site_url: https://oxistream.github.io/oxistream/
repo_url: https://github.com/oxistream/oxistream
repo_name: oxistream/oxistream
edit_uri: edit/main/docs/
copyright: Licensed under AGPL-3.0-or-later.
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/logo.svg
  icon:
    logo: oxistream/logo
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oxistream/oxistream
      name: Oxistream on GitHub

plugins:
  - search
  # Downloads Mermaid at build time, so pages load nothing from third parties.
  - privacy

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

exclude_docs: |
  includes/

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Setup:
      - setup/index.md
      - Docker Compose: setup/compose.md
      - Docker: setup/docker.md
      - Kubernetes: setup/kubernetes.md
  - Usage:
      - usage/index.md
      - Browsing: usage/browsing.md
      - Watching: usage/watching.md
      - Subscriptions and feed: usage/subscriptions.md
      - Library: usage/library.md
      - Watch parties: usage/watch-parties.md
      - Import and export: usage/import-export.md
      - Settings: usage/settings.md
      - Keyboard shortcuts: usage/shortcuts.md
      - YouTube-compatible URLs: usage/urls.md
  - Configuration: configuration.md
  - Administration:
      - administration/index.md
      - Upgrades and backups: administration/upgrades.md
      - Monitoring: administration/monitoring.md
  - Advanced:
      - advanced/index.md
      - Reverse proxy: advanced/reverse-proxy.md
      - Authentication: advanced/authentication.md
      - Replicas and rate limiting: advanced/scaling.md
      - Privacy: advanced/privacy.md
  - API: api.md
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Releasing: development/releasing.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
