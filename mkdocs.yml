site_name: Oxistream
site_description: Self-hosted, privacy-friendly YouTube frontend
site_url: https://oxistream.github.io/oxistream/
repo_url: https://github.com/oxistream/oxistream
repo_name: oxistream/oxistream
edit_uri: edit/main/docs/
copyright: Licensed under AGPL-3.0-or-later.
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/logo.svg
  icon:
    logo: oxistream/logo
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oxistream/oxistream
      name: Oxistream on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Docs:
      - Overview: overview.md
      - User guide: user-guide.md
      - Installation:
          - install/index.md
          - Docker: install/docker.md
          - Docker Compose: install/compose.md
          - Kubernetes: install/kubernetes.md
      - Configuration: configuration.md
      - Reverse proxy: reverse-proxy.md
      - Authentication: authentication.md
      - Administration: administration.md
      - Operations: operations.md
      - Privacy: privacy.md
      - Development:
          - development.md
          - Architecture: architecture.md
          - API: api.md
          - Releasing: releasing.md
